name: Analyse horaire

on:
  schedule:
    - cron: '7 * * * *'   # toutes les heures, à la 7e minute
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Envoyer une notification de test'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['docs/index.html', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier les calculs
        run: node scripts/test.mjs

      - name: Récupérer les cours et analyser
        run: node scripts/run.mjs
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TEST_NOTIFICATION: ${{ inputs.test_notification }}

      - name: Enregistrer l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Analyse du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
